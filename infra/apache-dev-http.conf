<VirtualHost *:80>
    ServerName 10.78.89.58
    DocumentRoot /srv/agm/site
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    Header always set Cache-Control "no-store"
    Header always set Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; form-action 'self'; object-src 'none'; base-uri 'self'"
    <Directory /srv/agm/site>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
        <FilesMatch "^(wp-config\.php|wp-cron\.php|wp-mail\.php|xmlrpc\.php|wp-trackback\.php)$">
            Require all denied
        </FilesMatch>
        <FilesMatch "(?i)(^\.|\.(sql|bak|log|ini|zip|tar|gz|phar)$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /srv/agm/site/wp-content>
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    php_admin_flag allow_url_fopen Off
    php_admin_flag short_open_tag On
    php_admin_value sendmail_path /bin/false
    php_admin_value disable_functions "mail,curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client,socket_connect,socket_sendto,exec,shell_exec,system,passthru,popen,proc_open,pcntl_exec"
    ErrorLog ${APACHE_LOG_DIR}/agm-staging-error.log
    CustomLog ${APACHE_LOG_DIR}/agm-staging-access.log combined
</VirtualHost>
