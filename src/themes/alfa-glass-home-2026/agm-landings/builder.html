<section id="triplex-builder" class="aml-section tb" aria-labelledby="tb-title" hidden>
  <p class="aml-eyebrow">Мой расчёт</p>
  <h2 id="tb-title">Триплекс с плоским стеклом</h2>
  <form id="tb-form">
    <fieldset><legend>Размеры и количество</legend>
      <div class="tb-row">
        <label>Ширина, мм<input name="width" type="number" min="1" max="3200" step="1" inputmode="numeric" placeholder="800" required></label>
        <label>Высота, мм<input name="height" type="number" min="1" max="3200" step="1" inputmode="numeric" placeholder="2000" required></label>
        <label>Количество, шт.<input name="quantity" type="number" min="1" max="9999" step="1" inputmode="numeric" value="1" required></label>
      </div>
      <small>Максимальный размер — 3200 × 2200 мм в любой ориентации.</small>
    </fieldset>
    <fieldset><legend>Состав триплекса</legend>
      <div class="tb-stack">
        <div><h3>Первое стекло</h3><label>Вид стекла<select name="front"></select></label><label>Толщина<select name="first"></select></label></div>
        <div><h3>Между стёклами</h3><label>Наполнение<select name="fill"></select></label>
          <label hidden data-color>Желаемый цвет<input name="color" maxlength="60" list="tb-colors" placeholder="Выберите или введите цвет"></label><datalist id="tb-colors"></datalist>
          <small data-film></small>
        </div>
        <div><h3>Второе стекло</h3><label>Вид стекла<select name="back"></select></label><label>Толщина<select name="second"></select></label><small data-limit></small></div>
      </div>
    </fieldset>
    <fieldset><legend>Обработка</legend>
      <div class="tb-row"><label>Кромка<select name="edge"><option>Полированная</option><option>Шлифованная</option></select></label>
      <label class="tb-check"><input type="checkbox" name="tempered">Закалить стёкла</label>
      <label class="tb-check"><input type="checkbox" name="pack">Обработать кромку в пакете</label></div>
      <small data-processing></small>
    </fieldset>
    <div class="tb-result"><strong>Ваш состав</strong><p data-result aria-live="polite"></p>
      <button type="submit">Добавить в «Мой расчёт»</button><p role="status" data-status></p></div>
  </form>
</section>
